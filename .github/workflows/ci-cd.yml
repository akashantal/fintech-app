name: Fintech App CI/CD with Docker Compose

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  docker-compose-ci:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Install Docker Compose (needed on GitHub runners)
      - name: Install Docker Compose
        run: |
          DOCKER_COMPOSE_VERSION=2.22.0
          sudo curl -L "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # 4️⃣ Start all services
      - name: Start Docker Compose services
        run: |
          docker-compose up -d
          echo "Waiting for Postgres..."
          until docker exec fintech-db pg_isready -U postgres; do sleep 2; done
          echo "Database is ready ✅"

      # 5️⃣ Wait for backend API to be ready
      - name: Wait for Backend
        run: |
          echo "Waiting for backend API to be ready..."
          until curl -s http://localhost:8000/ >/dev/null; do sleep 2; done
          echo "Backend is ready ✅"

      # 6️⃣ Run backend tests
      - name: Run Backend Tests
        run: docker exec fintech-backend pytest tests/

      # 7️⃣ Build frontend
      - name: Build Frontend
        run: |
          docker exec fintech-frontend npm install
          docker exec fintech-frontend npm run build -- --configuration production

      # 8️⃣ Optional: Run frontend E2E tests
      - name: Run Frontend E2E Tests
        run: |
          docker exec fintech-frontend npm install
          docker exec fintech-frontend npm run e2e

      # 9️⃣ Tear down services
      - name: Stop Services
        run: docker-compose down
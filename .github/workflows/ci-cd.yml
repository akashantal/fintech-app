name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Install Docker Compose v2
      - name: Install Docker Compose v2
        run: |
          DOCKER_COMPOSE_VERSION=2.22.0
          sudo curl -L "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker compose version

      # 4️⃣ Build backend Docker image
      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile -t fintech-backend:ci backend

      # 5️⃣ Build frontend Docker image
      - name: Build Frontend Docker Image
        run: docker build -f frontend/fintech-ui/Dockerfile -t fintech-frontend:ci frontend/fintech-ui

      # 6️⃣ Start all services using Docker Compose
      - name: Start Docker services
        run: docker compose -f docker-compose.yml up -d

      # 7️⃣ Wait for Postgres DB to be ready
      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres..."
          until docker exec fintech-db pg_isready -U postgres; do
            sleep 2
          done

      # 8️⃣ Run backend tests
      - name: Run backend tests
        run: docker exec fintech-backend pytest || true

      # 9️⃣ Build frontend inside container
      - name: Build frontend
        run: docker exec fintech-frontend npm run build -- --configuration production

      # 🔟 Run end-to-end tests only on main
      - name: Run E2E tests
        if: github.ref == 'refs/heads/main'
        run: docker exec fintech-backend pytest tests/e2e || true

      # 1️⃣1️⃣ Clean up
      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml down